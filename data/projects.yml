# Proyectos que se muestran en https://mangrovex.github.io
#
# La GitHub Action "Sincronizar proyectos" lee este archivo cada 6 horas, lo combina
# con los datos de la API de GitHub (descripción, lenguaje, estrellas, último push)
# y genera data/projects.json, que es lo que carga la página.
#
# Reglas:
#   - Cada tarjeta agrupa uno o más repos (`repos`). Si no pones `description`,
#     se usa la descripción del repo en GitHub.
#   - status: prod | wip | plan | arch
#   - categories: odoo | integ | fin | devops | mobile
#   - Los repos privados SOLO aparecen si están en este archivo, o si tienen el
#     topic `portafolio` en GitHub (entonces se crea una tarjeta automática).
#   - Los repos públicos que no estén en una tarjeta van a "Archivo y formación".
#   - Repos NUEVOS: cualquier repo propio (no fork) creado desde `auto_since` aparece
#     automáticamente como tarjeta "Nuevo" con su descripción de GitHub durante
#     `new_days` días (los privados sin enlace). Después, los públicos pasan al archivo
#     y los privados a "Otros repositorios privados", salvo que les hagas una tarjeta aquí.
#   - Para ocultar cualquier repo: agrégalo a `exclude` o ponle el topic `no-portafolio`.

auto_since: "2026-11-26"
new_days: 60

cards:
  - name: Musubi
    repos: [musubi]
    icon: "🧶"
    status: wip
    categories: [integ, devops]
    featured: true
    description: Framework de integración sobre Zato 4.1. Sistemas, APIs e IA conectados en un solo punto, de forma explícita y reproducible.
    bullets:
      - "CLI sin dependencias: init, profiles, validate, doctor"
      - Perfiles dev / stage / prod con políticas progresivas
      - Docker Compose con Zato 4.1 + Caddy, CI en Python 3.11/3.12
    tags: [Python, Zato 4.1, Docker, Caddy, GitHub Actions]
    links:
      - {label: Sitio, url: "https://mangrovex.github.io/musubi/"}

  - name: Chaskidoo
    repos: [chaskidoo]
    code: mangrovex/chaskidoo · fork de rocketdoo
    icon: "🏃"
    status: wip
    categories: [odoo, devops]
    featured: true
    description: Entornos de desarrollo y despliegue de Odoo con Docker, con opciones flexibles de base de datos y proxy.
    bullets:
      - "rkd init pregunta: PostgreSQL en Docker o en el VPS"
      - Proxy Nginx o Traefik a elección
      - Funciona en Linux y macOS
    tags: [Odoo, Docker, Nginx, Traefik, Python]
    links:
      - {label: Documentación, url: "https://mangrovex.github.io/chaskidoo/"}

  - name: flutter_paymentez_sdk
    repos: [flutter_paymentez_sdk]
    icon: "💳"
    status: prod
    categories: [fin, mobile]
    description: SDK en Flutter para integrar pagos con tarjeta mediante Paymentez en apps móviles.
    tags: [Flutter, Dart, Pagos]

  - name: fastApiOdoo
